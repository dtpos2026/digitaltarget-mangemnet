<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; width: 290px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; color: #1f1633; }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 14px; background: #3D096D; color: #fff; }
  main { padding: 12px 14px; display: grid; gap: 9px; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 8px 10px; font: inherit; font-weight: 600; background: #f1eaf9; color: #3D096D; }
  button.solid { background: #3D096D; color: #fff; }
  .small { font-size: 12px; color: #6b5a85; }
  code { background: #f4f1f8; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 2 2"><g fill="#fff"><polygon points="0,0 1,0 1,1"/><polygon points="1,0 2,0 2,1"/><polygon points="0,1 1,1 1,2"/><polygon points="1,1 2,1 2,2"/></g></svg>
    <b>Digital Target WhatsApp</b>
  </header>
  <main>
    <div class="small">Portal kholein → <b>WhatsApp</b> tab. WhatsApp Web wahin khulega; pehli dafa QR scan karein.</div>
    <button class="solid" id="portal">Portal kholein</button>
    <button id="wa">WhatsApp Web (alag window)</button>
    <div class="small" id="site"></div>
    <button id="add" hidden>Is website ko portal banayein</button>
    <div class="small" id="msg"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
